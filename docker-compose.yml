services:
  book-recommender:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_book_recommender
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Mount data directory so feedback and changes persist across container restarts
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
